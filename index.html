<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASCII Lilies</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: pointer;
      touch-action: pinch-zoom;
    }

    #wishMessage {
      position: fixed;
      bottom: 7.5%;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      width: min(88vw, 560px);
      text-align: center;
      color: rgba(255, 228, 238, 0.94);
      font-size: clamp(15px, 4vw, 20px);
      font-style: italic;
      font-weight: 400;
      letter-spacing: 0.7px;
      line-height: 1.6;
      text-shadow: 0 0 16px rgba(255, 130, 175, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.8s ease, transform 1.8s ease, color 0.8s ease, text-shadow 0.8s ease;
      z-index: 5;
      user-select: none;
      white-space: pre-line;
    }

    #wishMessage.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <!-- Tự động phát nhac.mp3 nếu có trên GitHub, nếu không sẽ tự chơi hộp nhạc piano -->
  <audio id="customAudio" src="nhac.mp3" loop preload="auto" autoplay></audio>
  <div id="wishMessage" aria-live="polite"></div>
  <canvas id="canvas"></canvas>

  <script>
    // =========================================================================
    // TÙY CHỈNH LỜI NHẮN (Dùng dấu | để xuống dòng khi truyền qua link ?msg=...)
    // =========================================================================
    const DEFAULT_MESSAGE = "✨ FOR YOU ✨";

    const wishEl = document.getElementById('wishMessage');
    const urlParams = new URLSearchParams(window.location.search);
    const customMsg = urlParams.get('msg') || urlParams.get('wish') || urlParams.get('text');
    const rawMessage = (customMsg !== null ? customMsg : DEFAULT_MESSAGE).trim();
    const activeMessage = rawMessage.replace(/\s*\|\s*/g, '\n');
    if (activeMessage) {
      wishEl.textContent = activeMessage;
    }

    const reduceMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    let prefersReducedMotion = reduceMotionQuery.matches;
    reduceMotionQuery.addEventListener('change', (e) => {
      prefersReducedMotion = e.matches;
    });

    // =========================================================================
    // 1. HỆ THỐNG ÂM THANH (NHAC.MP3 + HỘP NHẠC CÓ ĐỘ VANG & CHUÔNG CHẠM HOA)
    // =========================================================================
    const customAudio = document.getElementById('customAudio');

    let audioCtx = null;
    let masterInput = null;
    let isMusicPlaying = false;
    let hasCustomFile = true;
    let noteTimer = null;
    let stepIndex = 0;

    customAudio.addEventListener('error', () => {
      hasCustomFile = false;
      if (isMusicPlaying) {
        startSynthLoop();
      }
    });

    const melodySequence = [
      { f: 174.61, d: 2.5 }, { f: 261.63, d: 2.1 }, { f: 329.63, d: 2.1 }, { f: 392.00, d: 2.3 },
      { f: 329.63, d: 1.9 }, { f: 261.63, d: 1.9 }, { f: 440.00, d: 2.5 }, { f: 392.00, d: 2.3 },
      { f: 164.81, d: 2.5 }, { f: 246.94, d: 2.1 }, { f: 293.66, d: 2.1 }, { f: 392.00, d: 2.3 },
      { f: 293.66, d: 1.9 }, { f: 246.94, d: 1.9 }, { f: 329.63, d: 2.5 }, { f: 293.66, d: 2.3 },
      { f: 146.83, d: 2.5 }, { f: 220.00, d: 2.1 }, { f: 261.63, d: 2.1 }, { f: 329.63, d: 2.3 },
      { f: 261.63, d: 1.9 }, { f: 220.00, d: 1.9 }, { f: 349.23, d: 2.5 }, { f: 329.63, d: 2.3 },
      { f: 130.81, d: 2.5 }, { f: 196.00, d: 2.1 }, { f: 246.94, d: 2.1 }, { f: 329.63, d: 2.3 },
      { f: 293.66, d: 1.9 }, { f: 246.94, d: 1.9 }, { f: 261.63, d: 2.7 }, { f: 196.00, d: 2.3 }
    ];

    const chimeNotes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];

    function initAudioGraph() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx) {
        audioCtx = new AudioContextClass();

        // Bộ lọc làm ấm âm thanh + độ vang nhẹ nhàng
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 1450;

        const delay = audioCtx.createDelay(1.0);
        delay.delayTime.value = 0.34;

        const feedback = audioCtx.createGain();
        feedback.gain.value = 0.26;

        const wetGain = audioCtx.createGain();
        wetGain.gain.value = 0.24;

        filter.connect(audioCtx.destination);
        filter.connect(delay);
        delay.connect(feedback);
        feedback.connect(delay);
        delay.connect(wetGain);
        wetGain.connect(audioCtx.destination);

        masterInput = filter;
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }

    function playSoftNote(freq, duration, peakGain = 0.11) {
      if (!audioCtx || audioCtx.state !== 'running' || !masterInput) return;
      const now = audioCtx.currentTime;

      const oscMain = audioCtx.createOscillator();
      const oscOver = audioCtx.createOscillator();
      const gainMain = audioCtx.createGain();
      const gainOver = audioCtx.createGain();

      oscMain.type = 'sine';
      oscMain.frequency.setValueAtTime(freq, now);

      oscOver.type = 'triangle';
      oscOver.frequency.setValueAtTime(freq * 2, now);

      gainMain.gain.setValueAtTime(0.0001, now);
      gainMain.gain.exponentialRampToValueAtTime(peakGain, now + 0.045);
      gainMain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      gainOver.gain.setValueAtTime(0.0001, now);
      gainOver.gain.exponentialRampToValueAtTime(peakGain * 0.16, now + 0.03);
      gainOver.gain.exponentialRampToValueAtTime(0.0001, now + duration * 0.65);

      oscMain.connect(gainMain);
      oscOver.connect(gainOver);
      gainMain.connect(masterInput);
      gainOver.connect(masterInput);

      oscMain.start(now);
      oscOver.start(now);
      oscMain.stop(now + duration + 0.05);
      oscOver.stop(now + duration + 0.05);
    }

    function playFlowerChime(idx) {
      initAudioGraph();
      const freq = chimeNotes[idx % chimeNotes.length];
      playSoftNote(freq, 1.8, 0.075);
    }

    function startSynthLoop() {
      initAudioGraph();
      if (noteTimer) return;

      const scheduleNext = () => {
        if (audioCtx && audioCtx.state === 'running') {
          const note = melodySequence[stepIndex % melodySequence.length];
          playSoftNote(note.f, note.d, 0.11);
          stepIndex++;
        }
        // Nhịp rubato tự nhiên nhẹ nhàng thay vì đều máy móc
        const jitter = 450 + Math.sin(stepIndex * 0.7) * 35;
        noteTimer = setTimeout(scheduleNext, jitter);
      };
      scheduleNext();
    }

    function ensureMusicAutoplay() {
      if (hasCustomFile) {
        customAudio.volume = 0.75;
        const playPromise = customAudio.play();
        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              isMusicPlaying = true;
            })
            .catch((err) => {
              if (err && (err.name === 'NotSupportedError' || customAudio.error)) {
                hasCustomFile = false;
                startSynthLoop();
              }
            });
        }
      } else {
        startSynthLoop();
        if (audioCtx && audioCtx.state === 'running') {
          isMusicPlaying = true;
        }
      }
    }

    window.addEventListener('load', ensureMusicAutoplay);
    ensureMusicAutoplay();

    ['pointerdown', 'touchstart', 'click', 'keydown'].forEach((evt) => {
      window.addEventListener(evt, () => {
        if (!isMusicPlaying || (hasCustomFile && customAudio.paused) || (audioCtx && audioCtx.state === 'suspended')) {
          ensureMusicAutoplay();
        }
      }, { passive: true });
    });

    // =========================================================================
    // 2. BẢNG MÀU HOA LY (ĐỔI MÀU KHI CHẠM ĐÚP)
    // =========================================================================

        sparkle:[255, 185, 215],
        moon:   [34, 25, 42],
        textCol:'rgba(255, 228, 238, 0.94)',
        textGlow:'0 0 16px rgba(255, 130, 175, 0.6)'
      },
      {
        throat: [118, 148, 42],
        deep:   [198, 216, 172],
        soft:   [242, 247, 244],
        rim:    [255, 255, 255],
        spots:  [150, 122, 42],
        sparkle:[255, 248, 200],
        moon:   [25, 34, 46],
        textCol:'rgba(244, 250, 242, 0.94)',
        textGlow:'0 0 16px rgba(210, 235, 200, 0.55)'
      },
      {
        throat: [135, 36, 18],
        deep:   [236, 98, 60],
        soft:   [255, 178, 128],
        rim:    [255, 246, 234],
        spots:  [122, 26, 14],
        sparkle:[255, 205, 155],
        moon:   [40, 27, 25],
        textCol:'rgba(255, 234, 218, 0.94)',
        textGlow:'0 0 16px rgba(255, 155, 105, 0.6)'
      },
      {
        throat: [70, 24, 108],
        deep:   [156, 98, 218],
        soft:   [214, 180, 252],
        rim:    [250, 245, 255],
        spots:  [58, 16, 94],
        sparkle:[220, 190, 255],
        moon:   [30, 23, 48],
        textCol:'rgba(238, 224, 255, 0.94)',
        textGlow:'0 0 16px rgba(185, 140, 255, 0.6)'
      }
    ];

    let themeIndex = 0;
    const currentPalette = JSON.parse(JSON.stringify(COLOR_THEMES[0]));

    function applyThemeTextStyle() {
      const t = COLOR_THEMES[themeIndex];
      wishEl.style.color = t.textCol;
      wishEl.style.textShadow = t.textGlow;
    }

    function updatePalette(dt) {
      const target = COLOR_THEMES[themeIndex];
      const speed = Math.min(1, dt * 4.5);
      ['throat', 'deep', 'soft', 'rim', 'spots', 'sparkle', 'moon'].forEach((key) => {
        for (let i = 0; i < 3; i++) {
          currentPalette[key][i] += (target[key][i] - currentPalette[key][i]) * speed;
        }
      });
    }

    // =========================================================================
    // 3. TỐI ƯU CANVAS HI-DPI & TƯƠNG TÁC CHIỀU SÂU 2.5D
    // =========================================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

    const ASCII_RAMP = ' .\'`:-=+*#%@';
    const CHAR_LUT = new Array(256);
    for (let i = 0; i < 256; i++) {
      const idx = Math.min(ASCII_RAMP.length - 1, Math.floor((i / 256) * ASCII_RAMP.length));
      CHAR_LUT[i] = ASCII_RAMP[idx];
    }

    let width = 0;
    let height = 0;
    let dpr = 1;
    let cellSize = 4;
    let cols = 0;
    let rows = 0;

    const startTime = performance.now();
    let lastFrameTime = startTime;
    let wishShown = false;

    let pointerWind = 0;
    let targetPointerWind = 0;
    let parallaxX = 0;
    let parallaxY = 0;
    let targetParallaxX = 0;
    let targetParallaxY = 0;

    let isPointerDown = false;
    let activePointerId = null;
    let lastPointerX = 0;
    let pointerDownTime = 0;
    let lastTapTime = 0;
    let lastTapX = 0;
    let lastTapY = 0;

    const burstParticles = [];
    const fallingPetals = [];
    const shootingStar = {
      active: false,
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      life: 0,
      maxLife: 1.1,
      nextSpawn: 4.5
    };

    function resize() {
      width = window.innerWidth || 390;
      height = window.innerHeight || 844;
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);

      cellSize = Math.max(4, Math.floor(Math.min(width, height) / 114));
      cols = Math.ceil(width / cellSize);
      rows = Math.ceil(height / cellSize);
      offCanvas.width = cols;
      offCanvas.height = rows;
    }

    window.addEventListener('resize', resize);
    resize();

    function clamp01(v) {
      return v < 0 ? 0 : v > 1 ? 1 : v;
    }

    function smoothstep(e0, e1, x) {
      const t = clamp01((x - e0) / (e1 - e0));
      return t * t * (3 - 2 * t);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function lerpRGB(c1, c2, t) {
      const r = Math.round(lerp(c1[0], c2[0], t));
      const g = Math.round(lerp(c1[1], c2[1], t));
      const b = Math.round(lerp(c1[2], c2[2], t));
      return `rgb(${r},${g},${b})`;
    }

    function evalQuadBezier(p0, p1, p2, t) {
      const mt = 1 - t;
      return {
        x: mt * mt * p0.x + 2 * mt * t * p1.x + t * t * p2.x,
        y: mt * mt * p0.y + 2 * mt * t * p1.y + t * t * p2.y
      };
    }

    const lilyNodes = [
      { z: 0, dx: -0.11, dy: -0.35, bend: -0.06, scale: 0.90, rot: -0.22, tilt: 0.80, growStart: 0.15, growEnd: 1.75, bloomStart: 4.10, bloomEnd: 5.45, maxOpen: 0.96, shade: 0.86, phase: 2.7, pulse: 0, screenX: 0, screenY: 0 },
      { z: 0, dx:  0.08, dy: -0.33, bend:  0.05, scale: 0.88, rot:  0.25, tilt: 0.82, growStart: 0.18, growEnd: 1.78, bloomStart: 4.35, bloomEnd: 5.65, maxOpen: 0.95, shade: 0.88, phase: 3.4, pulse: 0, screenX: 0, screenY: 0 },
      { z: 1, dx:  0.23, dy: -0.24, bend:  0.14, scale: 0.94, rot:  0.52, tilt: 0.84, growStart: 0.14, growEnd: 1.70, bloomStart: 4.55, bloomEnd: 5.85, maxOpen: 1.00, shade: 0.94, phase: 4.1, pulse: 0, screenX: 0, screenY: 0 },
      { z: 1, dx: -0.27, dy: -0.25, bend: -0.16, scale: 0.98, rot: -0.92, tilt: 0.85, growStart: 0.20, growEnd: 1.80, bloomStart: 4.00, bloomEnd: 5.30, maxOpen: 0.18, shade: 0.95, phase: 1.5, pulse: 0, screenX: 0, screenY: 0 },
      { z: 2, dx:  0.04, dy: -0.19, bend:  0.02, scale: 0.96, rot:  0.10, tilt: 0.88, growStart: 0.05, growEnd: 1.50, bloomStart: 3.00, bloomEnd: 4.30, maxOpen: 1.00, shade: 1.00, phase: 0.2, pulse: 0, screenX: 0, screenY: 0 },
      { z: 2, dx: -0.19, dy: -0.18, bend: -0.11, scale: 1.02, rot: -0.44, tilt: 0.86, growStart: 0.10, growEnd: 1.60, bloomStart: 3.45, bloomEnd: 4.75, maxOpen: 1.00, shade: 1.00, phase: 1.1, pulse: 0, screenX: 0, screenY: 0 },
      { z: 3, dx:  0.16, dy: -0.10, bend:  0.09, scale: 1.14, rot:  0.30, tilt: 0.92, growStart: 0.02, growEnd: 1.45, bloomStart: 3.75, bloomEnd: 5.10, maxOpen: 1.00, shade: 1.04, phase: 2.0, pulse: 0, screenX: 0, screenY: 0 },
      { z: 3, dx: -0.05, dy: -0.06, bend: -0.03, scale: 0.92, rot: -0.15, tilt: 0.88, growStart: 0.08, growEnd: 1.55, bloomStart: 4.25, bloomEnd: 5.55, maxOpen: 0.92, shade: 1.02, phase: 4.8, pulse: 0, screenX: 0, screenY: 0 }
    ];

    const fillerNodes = [
      { dx: -0.26, dy: -0.09, bend: -0.15, r: 0.072, growStart: 0.10, growEnd: 1.45, bloomStart: 2.35, bloomEnd: 3.40, phase: 0.3 },
      { dx: -0.06, dy: -0.27, bend: -0.03, r: 0.066, growStart: 0.16, growEnd: 1.62, bloomStart: 2.55, bloomEnd: 3.60, phase: 1.2 },
      { dx:  0.14, dy: -0.29, bend:  0.08, r: 0.064, growStart: 0.18, growEnd: 1.68, bloomStart: 2.75, bloomEnd: 3.75, phase: 2.1 },
      { dx: -0.12, dy: -0.12, bend: -0.07, r: 0.062, growStart: 0.08, growEnd: 1.40, bloomStart: 2.45, bloomEnd: 3.45, phase: 2.9 },
      { dx:  0.26, dy: -0.16, bend:  0.15, r: 0.066, growStart: 0.14, growEnd: 1.58, bloomStart: 2.85, bloomEnd: 3.85, phase: 3.7 },
      { dx:  0.04, dy: -0.01, bend:  0.02, r: 0.058, growStart: 0.06, growEnd: 1.35, bloomStart: 2.65, bloomEnd: 3.65, phase: 4.4 }
    ];

    const twigNodes = [
      { dx: -0.30, dy: -0.15, bend: -0.18, growStart: 0.12, growEnd: 1.55 },
      { dx:  0.30, dy: -0.14, bend:  0.18, growStart: 0.14, growEnd: 1.58 },
      { dx: -0.21, dy: -0.31, bend: -0.12, growStart: 0.22, growEnd: 1.78 },

      { dx:  0.18, dy:  0.01, bend:  0.10, growStart: 0.06, growEnd: 1.28 }
    ];

    const foliageLeaves = [
      { stemIdx: 4,  t: 0.24, ang: -0.62, len: 0.23, wid: 0.050, base: '#143b18', tip: '#27662c', dew: false },
      { stemIdx: 6,  t: 0.25, ang:  0.64, len: 0.23, wid: 0.050, base: '#163f1a', tip: '#2b6e30', dew: false },
      { stemIdx: 4,  t: 0.38, ang: -0.95, len: 0.27, wid: 0.056, base: '#1a4a1f', tip: '#347d39', dew: true },
      { stemIdx: 6,  t: 0.37, ang:  0.94, len: 0.27, wid: 0.056, base: '#1c4f22', tip: '#38853d', dew: false },
      { stemIdx: 5,  t: 0.42, ang: -1.12, len: 0.30, wid: 0.058, base: '#215926', tip: '#499e48', dew: false },
      { stemIdx: 2,  t: 0.44, ang:  1.10, len: 0.30, wid: 0.058, base: '#235e28', tip: '#4ca34b', dew: true },
      { stemIdx: 3,  t: 0.48, ang: -0.78, len: 0.26, wid: 0.052, base: '#26662c', tip: '#56b04f', dew: false },
      { stemIdx: 1,  t: 0.50, ang:  0.76, len: 0.26, wid: 0.052, base: '#286b2e', tip: '#5bb553', dew: false },
      { stemIdx: 0,  t: 0.62, ang: -0.58, len: 0.23, wid: 0.046, base: '#2f7835', tip: '#73c75a', dew: true },
      { stemIdx: 1,  t: 0.64, ang:  0.56, len: 0.23, wid: 0.046, base: '#327d38', tip: '#7acc5e', dew: false },
      { stemIdx: 5,  t: 0.68, ang: -0.72, len: 0.24, wid: 0.048, base: '#2d7332', tip: '#6bc255', dew: false },
      { stemIdx: 2,  t: 0.68, ang:  0.70, len: 0.24, wid: 0.048, base: '#2f7835', tip: '#70c759', dew: false },
      { stemIdx: 14, t: 0.55, ang: -1.22, len: 0.22, wid: 0.044, base: '#246129', tip: '#59b350', dew: false },
      { stemIdx: 15, t: 0.55, ang:  1.20, len: 0.22, wid: 0.044, base: '#26662b', tip: '#5eb854', dew: false },
      { stemIdx: 18, t: 0.60, ang: -0.88, len: 0.20, wid: 0.042, base: '#1f5424', tip: '#4aa147', dew: false },
      { stemIdx: 19, t: 0.60, ang:  0.86, len: 0.20, wid: 0.042, base: '#215926', tip: '#4fa64b', dew: false }
    ];

    const pollenParticles = Array.from({ length: 24 }, (_, i) => ({
      seed: i * 1.73,
      rx: ((i * 37) % 100) / 100 - 0.5,
      ry: ((i * 53) % 100) / 100 - 0.5,
      speed: 0.35 + (i % 5) * 0.12,
      size: 2.2 + (i % 3) * 1.1,
      isAccent: i % 3 === 0
    }));

    function spawnFallingPetal(x, y, windPush) {
      if (fallingPetals.length > 26) return;
      fallingPetals.push({
        x,
        y,
        vy: 18 + Math.random() * 22,
        vx: windPush * 35 + (Math.random() - 0.5) * 16,
        swayPhase: Math.random() * Math.PI * 2,
        swayFreq: 1.6 + Math.random() * 1.4,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 2.4,
        size: Math.max(5.5, cellSize * (1.4 + Math.random() * 0.8)),
        alpha: 0.9
      });
    }

    function spawnBurst(x, y, count, isFlowerTap) {
      const sp = currentPalette.sparkle;
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + Math.random() * 0.5;
        const speed = (isFlowerTap ? 45 : 22) + Math.random() * 65;
        burstParticles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - (isFlowerTap ? 25 : 10),
          life: 1.0,
          decay: 0.65 + Math.random() * 0.55,
          size: Math.max(cellSize * 0.65, isFlowerTap ? 3.2 + Math.random() * 2.2 : 2.2 + Math.random() * 1.5),
          color: i % 2 === 0
            ? [Math.round(sp[0]), Math.round(sp[1]), Math.round(sp[2])]
            : [255, 250, 210]
        });
      }
    }

    function revealWish() {
      if (activeMessage && !wishShown) {
        wishShown = true;
        wishEl.classList.add('visible');
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (!e.isPrimary) return;
      const now = performance.now();
      isPointerDown = true;
      activePointerId = e.pointerId;
      lastPointerX = e.clientX;
      pointerDownTime = now;

      targetParallaxX = ((e.clientX / width) - 0.5) * 16;
      targetParallaxY = ((e.clientY / height) - 0.5) * 12;

      // Chạm đúp để đổi màu bó hoa + phát hợp âm chuông
      if (now - lastTapTime < 320 && Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 42) {
        themeIndex = (themeIndex + 1) % COLOR_THEMES.length;
        applyThemeTextStyle();
        spawnBurst(e.clientX, e.clientY, 26, true);
        playFlowerChime(themeIndex + 2);
        revealWish();
        lastTapTime = 0;
        return;
      }
      lastTapTime = now;
      lastTapX = e.clientX;
      lastTapY = e.clientY;

      const hitRadius = Math.min(width, height) * 0.14;
      let hitFlower = false;
      lilyNodes.forEach((node, idx) => {
        const dist = Math.hypot(e.clientX - node.screenX, e.clientY - node.screenY);
        if (dist < hitRadius) {
          node.pulse = 1.0;
          hitFlower = true;
          spawnBurst(node.screenX, node.screenY, 20, true);
          spawnFallingPetal(node.screenX, node.screenY, (Math.random() - 0.5) * 1.2);
          playFlowerChime(idx);
          revealWish();
        }
      });

      if (!hitFlower) {
        spawnBurst(e.clientX, e.clientY, 10, false);
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      targetParallaxX = ((e.clientX / width) - 0.5) * 16;
      targetParallaxY = ((e.clientY / height) - 0.5) * 12;

      if (!isPointerDown || e.pointerId !== activePointerId) return;

      const dx = e.clientX - lastPointerX;
      lastPointerX = e.clientX;
      const windDelta = dx * 0.013;
      targetPointerWind = Math.max(-1.8, Math.min(1.8, targetPointerWind + windDelta));

      if (Math.random() < 0.55) {
        spawnBurst(e.clientX, e.clientY, 2, false);
      }
      if (Math.abs(dx) > 6 && Math.random() < 0.25) {
        const donor = lilyNodes[Math.floor(Math.random() * lilyNodes.length)];
        if (donor && donor.screenX > 0) {
          spawnFallingPetal(donor.screenX, donor.screenY, Math.sign(dx) * 0.9);
        }
      }
    });

    function clearPointer(e) {
      if (e.pointerId === activePointerId) {
        isPointerDown = false;
        activePointerId = null;
      }
    }

    window.addEventListener('pointerup', clearPointer);
    window.addEventListener('pointercancel', clearPointer);

    // =========================================================================
    // 4. HÀM VẼ MÔI TRƯỜNG, LÁ, HOA LY VÀ HẠT SÁNG
    // =========================================================================
    function drawMoonlightAndStars(c, cx, cy, bouquetSize, elapsed, dt) {
      const moonFade = smoothstep(0.5, 3.0, elapsed);
      if (moonFade > 0.01) {
        const mx = cx - bouquetSize * 0.16 - parallaxX * 0.35;
        const my = cy - bouquetSize * 0.25 - parallaxY * 0.35;
        const breathe = 1 + Math.sin(elapsed * 0.9) * 0.04;
        const radius = bouquetSize * 0.64 * breathe;
        const mCol = currentPalette.moon;

        const grad = c.createRadialGradient(mx, my, radius * 0.05, mx, my, radius);
        grad.addColorStop(0.0, `rgba(${Math.round(mCol[0] * 1.4)}, ${Math.round(mCol[1] * 1.4)}, ${Math.round(mCol[2] * 1.4)}, ${0.95 * moonFade})`);
        grad.addColorStop(0.55, `rgba(${Math.round(mCol[0] * 0.72)}, ${Math.round(mCol[1] * 0.72)}, ${Math.round(mCol[2] * 0.72)}, ${0.45 * moonFade})`);
        grad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');

        c.fillStyle = grad;
        c.beginPath();
        c.arc(mx, my, radius, 0, Math.PI * 2);
        c.fill();
      }

      // Sao băng lướt nhẹ qua bầu trời đêm phía trên bó hoa
      if (!prefersReducedMotion) {
        if (!shootingStar.active && elapsed > shootingStar.nextSpawn) {
          shootingStar.active = true;
          shootingStar.x = width * (0.15 + Math.random() * 0.45);
          shootingStar.y = height * (0.06 + Math.random() * 0.14);
          shootingStar.vx = width * (0.38 + Math.random() * 0.2);
          shootingStar.vy = height * (0.14 + Math.random() * 0.08);
          shootingStar.life = 0;
          shootingStar.maxLife = 0.85;
          shootingStar.nextSpawn = elapsed + 7.5 + Math.random() * 5.0;
        }

        if (shootingStar.active) {
          shootingStar.life += dt;
          shootingStar.x += shootingStar.vx * dt;
          shootingStar.y += shootingStar.vy * dt;

          const p = shootingStar.life / shootingStar.maxLife;
          if (p >= 1) {
            shootingStar.active = false;
          } else {
            const alpha = Math.sin(p * Math.PI) * 0.85;
            const tailX = shootingStar.x - shootingStar.vx * 0.16;
            const tailY = shootingStar.y - shootingStar.vy * 0.16;

            const starGrad = c.createLinearGradient(tailX, tailY, shootingStar.x, shootingStar.y);
            starGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
            starGrad.addColorStop(1, `rgba(255, 250, 235, ${alpha})`);

            c.strokeStyle = starGrad;
            c.lineWidth = Math.max(cellSize * 0.9, 3.5);
            c.beginPath();
            c.moveTo(tailX, tailY);
            c.lineTo(shootingStar.x, shootingStar.y);
            c.stroke();
          }
        }
      }
    }

    function drawDetailedLeaf(c, x, y, angle, length, widthLeaf, baseCol, tipCol, scale, hasDew, elapsed) {
      if (scale <= 0.01) return;
      c.save();
      c.translate(x, y);
      c.rotate(angle);
      c.scale(scale, scale);

      const grad = c.createLinearGradient(0, 0, 0, -length);
      grad.addColorStop(0.0, baseCol);
      grad.addColorStop(0.7, tipCol);
      grad.addColorStop(1.0, '#9be06c');

      c.fillStyle = grad;
      c.beginPath();
      c.moveTo(0, 0);
      c.bezierCurveTo(widthLeaf * 1.15, -length * 0.35, widthLeaf * 0.75, -length * 0.78, 0, -length);
      c.bezierCurveTo(-widthLeaf * 0.75, -length * 0.78, -widthLeaf * 1.15, -length * 0.35, 0, 0);
      c.fill();

      c.strokeStyle = 'rgba(175, 235, 120, 0.42)';
      c.lineWidth = Math.max(cellSize * 0.75, widthLeaf * 0.14);
      c.beginPath();
      c.moveTo(0, -length * 0.06);
      c.lineTo(0, -length * 0.85);
      c.stroke();

      // Giọt sương nhỏ lấp lánh trên lá
      if (hasDew && scale > 0.85) {
        const glint = 0.55 + 0.45 * Math.sin(elapsed * 2.6 + length);
        c.fillStyle = `rgba(235, 255, 245, ${glint})`;
        c.beginPath();
        c.arc(widthLeaf * 0.25, -length * 0.56, Math.max(cellSize * 0.55, 2.4), 0, Math.PI * 2);
        c.fill();
      }

      c.restore();
    }

    function drawDetailedLily(c, x, y, size, rotation, tilt, budScale, openProgress, shade, pulse, elapsed, phase) {
      if (budScale <= 0.02) return;

      const pulseBoost = 1 + pulse * 0.22;
      const effectiveOpen = clamp01(openProgress + pulse * 0.15);

      c.save();
      c.translate(x, y);
      c.rotate(rotation + Math.sin(pulse * Math.PI * 3) * 0.14);
      c.scale(budScale * pulseBoost, budScale * pulseBoost * lerp(1, tilt, effectiveOpen));

      const petalLen = size * lerp(0.74, 1.08, effectiveOpen);
      const petalWid = size * lerp(0.15, 0.38, effectiveOpen);

      const throatCol = lerpRGB([98, 130, 34],  currentPalette.throat, effectiveOpen);
      const deepCol   = lerpRGB([152, 178, 56], currentPalette.deep,   effectiveOpen);
      const softCol   = lerpRGB([198, 210, 96], currentPalette.soft,   effectiveOpen);
      const rimCol    = lerpRGB([224, 218, 165],currentPalette.rim,    effectiveOpen);

      const petalOrder = [0, 2, 4, 1, 3, 5];

      for (let idx = 0; idx < 6; idx++) {
        const i = petalOrder[idx];
        const isInner = idx >= 3;
        const wFactor = isInner ? 1.08 : 0.92;
        const lFactor = isInner ? 1.02 : 0.96;

        const closedAngle = (i - 2.5) * 0.055;
        const baseOpenAngle = (i * Math.PI) / 3 + Math.sin(elapsed * 1.5 + phase + i) * 0.03;
        const angle = lerp(closedAngle, baseOpenAngle, effectiveOpen);

        const facingLight = 0.88 + 0.14 * Math.cos(angle - 0.3);
        const pLen = petalLen * lFactor;
        const pWid = petalWid * wFactor;

        c.save();
        c.rotate(angle);

        const grad = c.createLinearGradient(0, 0, 0, -pLen);
        grad.addColorStop(0.00, throatCol);
        grad.addColorStop(0.24, deepCol);
        grad.addColorStop(0.68, softCol);
        grad.addColorStop(0.92, rimCol);
        grad.addColorStop(1.00, '#ffffff');

        c.fillStyle = grad;
        c.beginPath();
        c.moveTo(0, 0);
        c.bezierCurveTo(
          pWid * 0.95, -pLen * 0.25,
          pWid * 1.05, -pLen * 0.62,
          pWid * 0.42, -pLen * 0.86
        );
        c.quadraticCurveTo(pWid * 0.14, -pLen * 0.96, 0, -pLen);
        c.quadraticCurveTo(-pWid * 0.14, -pLen * 0.96, -pWid * 0.42, -pLen * 0.86);
        c.bezierCurveTo(
          -pWid * 1.05, -pLen * 0.62,
          -pWid * 0.95, -pLen * 0.25,
          0, 0
        );
        c.fill();

        if (effectiveOpen > 0.2) {
          c.strokeStyle = `rgba(255, 248, 252, ${Math.min(1, (0.65 + pulse * 0.35) * effectiveOpen * facingLight)})`;
          c.lineWidth = Math.max(cellSize * 0.55, size * 0.025);
          c.stroke();
        }

        if (effectiveOpen > 0.28) {
          const detailAlpha = clamp01((effectiveOpen - 0.28) / 0.72);
          const sp = currentPalette.spots;

          c.strokeStyle = `rgba(255, 230, 240, ${0.50 * detailAlpha})`;
          c.lineWidth = Math.max(cellSize * 0.6, size * 0.028);
          c.beginPath();
          c.moveTo(0, -size * 0.10);
          c.lineTo(0, -pLen * 0.82);
          c.stroke();

          c.fillStyle = `rgba(${Math.round(sp[0])}, ${Math.round(sp[1])}, ${Math.round(sp[2])}, ${0.88 * detailAlpha})`;
          for (let d = 1; d <= 4; d++) {
            const dist = pLen * (0.18 + d * 0.095);
            const spread = pWid * (0.14 + (d % 2) * 0.08);
            const dotR = Math.max(cellSize * 0.45, size * 0.022);
            c.beginPath();
            c.arc(-spread, -dist, dotR, 0, Math.PI * 2);
            c.arc(spread, -dist * 0.96, dotR, 0, Math.PI * 2);
            if (d <= 2) {
              c.arc(0, -dist * 1.04, dotR * 0.9, 0, Math.PI * 2);
            }
            c.fill();
          }
        }

        c.restore();
      }

      if (effectiveOpen > 0.35) {
        const stScale = clamp01((effectiveOpen - 0.35) / 0.65);
        for (let s = 0; s < 6; s++) {
          const sAngle = (s * Math.PI * 2) / 6 + 0.25 + Math.sin(elapsed * 2 + s) * 0.04;
          const sLen = size * (s === 5 ? 0.42 : 0.36) * stScale;
          const tipX = Math.cos(sAngle) * sLen;
          const tipY = Math.sin(sAngle) * sLen;

          c.strokeStyle = '#e4f2a7';
          c.lineWidth = Math.max(cellSize * 0.65, size * 0.026);
          c.beginPath();
          c.moveTo(0, 0);
          c.quadraticCurveTo(tipX * 0.5, tipY * 0.35 - sLen * 0.22, tipX, tipY);
          c.stroke();

          c.fillStyle = s === 5 ? '#96c954' : '#b84a14';
          c.beginPath();
          c.ellipse(
            tipX,
            tipY,
            Math.max(cellSize * 0.6, size * 0.046 * stScale),
            Math.max(cellSize * 0.4, size * 0.028 * stScale),
            sAngle,
            0,
            Math.PI * 2
          );
          c.fill();
        }
      }

      if (pulse > 0.01) {
        c.fillStyle = `rgba(255, 250, 230, ${pulse * 0.32})`;
        c.beginPath();
        c.arc(0, 0, size * 1.15, 0, Math.PI * 2);
        c.fill();
      }

      if (shade < 0.98 && pulse < 0.2) {
        c.fillStyle = `rgba(0, 0, 0, ${(1 - shade) * (1 - pulse)})`;
        c.beginPath();
        c.arc(0, 0, size * 1.15, 0, Math.PI * 2);
        c.fill();
      }

      c.restore();
    }

    function drawBabyBreathCluster(c, x, y, radius, bloom, elapsed) {
      if (bloom <= 0.02) return;
      const count = 13;
      for (let i = 0; i < count; i++) {
        const delay = (i / count) * 0.38;
        const p = clamp01((bloom - delay) / (1 - delay));
        if (p <= 0.01) continue;

        const angle = (i / count) * Math.PI * 2 + (i % 3) * 0.5 + elapsed * 0.2;
        const dist = (0.18 + ((i * 3) % 5) * 0.22) * radius * p;
        const fx = x + Math.cos(angle) * dist;
        const fy = y + Math.sin(angle) * dist;
        const r = Math.max(cellSize * 0.55, radius * (0.24 + (i % 2) * 0.07) * p);

        c.fillStyle = '#5c8a58';
        c.beginPath();
        c.arc(fx, fy + r * 0.25, r * 0.85, 0, Math.PI * 2);
        c.fill();

        c.fillStyle = i % 3 === 0 ? '#ffffff' : '#edf5ed';
        c.beginPath();
        c.arc(fx, fy, r, 0, Math.PI * 2);
        c.fill();
      }
    }

    function renderScene(elapsed, dt) {
      offCtx.setTransform(1, 0, 0, 1, 0, 0);
      offCtx.fillStyle = '#000000';
      offCtx.fillRect(0, 0, cols, rows);

      const invScale = 1 / cellSize;
      offCtx.setTransform(invScale, 0, 0, invScale, 0, 0);

      const bouquetSize = Math.min(width * 0.92, height * 0.72);
      const cx = width * 0.50;
      const cy = height * 0.48;

      drawMoonlightAndStars(offCtx, cx, cy, bouquetSize, elapsed, dt);

      const motionFactor = prefersReducedMotion ? 0.25 : 1.0;
      const swayStrength = smoothstep(1.4, 4.5, elapsed) * motionFactor;
      const naturalSway = Math.sin(elapsed * 1.5) * 0.030 + Math.sin(elapsed * 2.7) * 0.008;
      const sway = (naturalSway * swayStrength + pointerWind * 0.08) * bouquetSize;

      const baseX = cx + sway * 0.10 + parallaxX * 0.2;
      const baseY = cy + bouquetSize * 0.56 + parallaxY * 0.2;

      const allStems = [];

      lilyNodes.forEach((node, idx) => {
        node.pulse = Math.max(0, node.pulse - dt * 1.4);
        const depthFactor = 0.45 + (node.z / 3) * 0.55;

        const p0 = { x: baseX + (idx - 3.5) * bouquetSize * 0.007, y: baseY };
        const p1 = {
          x: cx + node.bend * bouquetSize * 0.65 + sway * 0.36 + parallaxX * 0.45 * depthFactor,
          y: cy + bouquetSize * 0.20 + parallaxY * 0.45 * depthFactor
        };
        const p2 = {
          x: cx + node.dx * bouquetSize + sway * (0.85 + Math.abs(node.dy) * 0.45) + parallaxX * depthFactor,
          y: cy + node.dy * bouquetSize + Math.sin(elapsed * 1.5 + node.phase) * 2 * motionFactor + parallaxY * depthFactor
        };
        const grow = smoothstep(node.growStart, node.growEnd, elapsed);
        allStems.push({
          p0, p1, p2, grow,
          color: node.z <= 1 ? '#235e28' : '#38873e',
          widthFactor: 0.017,
          type: 'lily',
          node
        });
      });

      fillerNodes.forEach((node, idx) => {
        const p0 = { x: baseX + (idx - 2.5) * bouquetSize * 0.006, y: baseY };
        const p1 = {
          x: cx + node.bend * bouquetSize * 0.65 + sway * 0.34 + parallaxX * 0.35,
          y: cy + bouquetSize * 0.22 + parallaxY * 0.35
        };
        const p2 = {
          x: cx + node.dx * bouquetSize + sway * 0.85 + parallaxX * 0.7,
          y: cy + node.dy * bouquetSize + parallaxY * 0.7
        };
        const grow = smoothstep(node.growStart, node.growEnd, elapsed);
        allStems.push({
          p0, p1, p2, grow,
          color: '#296e2f',
          widthFactor: 0.014,
          type: 'filler',
          node
        });
      });

      twigNodes.forEach((node, idx) => {
        const p0 = { x: baseX + (idx - 2.5) * bouquetSize * 0.006, y: baseY };
        const p1 = {
          x: cx + node.bend * bouquetSize * 0.60 + sway * 0.30 + parallaxX * 0.3,
          y: cy + bouquetSize * 0.24 + parallaxY * 0.3
        };
        const p2 = {
          x: cx + node.dx * bouquetSize + sway * 0.75 + parallaxX * 0.6,
          y: cy + node.dy * bouquetSize + parallaxY * 0.6
        };
        const grow = smoothstep(node.growStart, node.growEnd, elapsed);
        allStems.push({
          p0, p1, p2, grow,
          color: '#1f5424',
          widthFactor: 0.013,
          type: 'twig',
          node
        });
      });

      allStems.forEach((st) => {
        if (st.grow <= 0.005) return;
        const q0 = {
          x: lerp(st.p0.x, st.p1.x, st.grow),
          y: lerp(st.p0.y, st.p1.y, st.grow)
        };
        const tip = evalQuadBezier(st.p0, st.p1, st.p2, st.grow);

        offCtx.strokeStyle = st.color;
        offCtx.lineWidth = Math.max(cellSize * 1.15, bouquetSize * st.widthFactor);
        offCtx.lineCap = 'round';
        offCtx.beginPath();
        offCtx.moveTo(st.p0.x, st.p0.y);
        offCtx.quadraticCurveTo(q0.x, q0.y, tip.x, tip.y);
        offCtx.stroke();
      });

      const tieGrow = smoothstep(0.1, 0.7, elapsed);
      if (tieGrow > 0.01) {
        const tiePos = {
          x: lerp(baseX, cx + sway * 0.22 + parallaxX * 0.3, 0.45),
          y: lerp(baseY, cy + bouquetSize * 0.22 + parallaxY * 0.3, 0.45)
        };
        offCtx.strokeStyle = '#58ad4e';
        offCtx.lineWidth = Math.max(cellSize * 1.2, bouquetSize * 0.018 * tieGrow);
        offCtx.beginPath();
        offCtx.moveTo(tiePos.x - bouquetSize * 0.032, tiePos.y - 2);
        offCtx.lineTo(tiePos.x + bouquetSize * 0.032, tiePos.y + 2);
        offCtx.stroke();
      }

      foliageLeaves.forEach((lf, idx) => {
        const st = allStems[lf.stemIdx];
        if (!st || st.grow < lf.t * 0.82) return;

        const leafGrow = clamp01((st.grow - lf.t * 0.82) / (1 - lf.t * 0.72));
        const pos = evalQuadBezier(st.p0, st.p1, st.p2, lf.t);
        const leafAngle = lf.ang + Math.sin(elapsed * 1.8 + idx) * 0.045 * swayStrength + pointerWind * 0.08;

        drawDetailedLeaf(
          offCtx,
          pos.x,
          pos.y,
          leafAngle,
          lf.len * bouquetSize,
          lf.wid * bouquetSize,
          lf.base,
          lf.tip,
          smoothstep(0, 1, leafGrow),
          lf.dew,
          elapsed
        );
      });

      allStems.forEach((st) => {
        if (st.type !== 'filler') return;
        const tip = evalQuadBezier(st.p0, st.p1, st.p2, st.grow);
        const bloom = smoothstep(st.node.bloomStart, st.node.bloomEnd, elapsed);
        drawBabyBreathCluster(offCtx, tip.x, tip.y, st.node.r * bouquetSize, bloom, elapsed);
      });

      allStems
        .filter((st) => st.type === 'lily')
        .sort((a, b) => a.node.z - b.node.z)
        .forEach((st) => {
          const n = st.node;
          const tip = evalQuadBezier(st.p0, st.p1, st.p2, st.grow);
          n.screenX = tip.x;
          n.screenY = tip.y;

          const budScale = smoothstep(n.growEnd - 0.55, n.growEnd + 0.35, elapsed);
          const openProgress = smoothstep(n.bloomStart, n.bloomEnd, elapsed) * n.maxOpen;
          const rot = n.rot + Math.sin(elapsed * 1.6 + n.phase) * 0.045 * swayStrength + pointerWind * 0.10;

          drawDetailedLily(
            offCtx,
            tip.x,
            tip.y,
            bouquetSize * 0.155 * n.scale,
            rot,
            n.tilt,
            budScale,
            openProgress,
            n.shade,
            n.pulse,
            elapsed,
            n.phase
          );
        });

      if (elapsed > 4.5 && !prefersReducedMotion && Math.random() < dt * 1.3) {
        const donor = lilyNodes[Math.floor(Math.random() * lilyNodes.length)];
        if (donor && donor.maxOpen > 0.5 && donor.screenX > 0) {
          spawnFallingPetal(
            donor.screenX + (Math.random() - 0.5) * 20,
            donor.screenY + 10,
            pointerWind * 0.5
          );
        }
      }

      const petalFill = lerpRGB(currentPalette.soft, currentPalette.rim, 0.45);
      for (let i = fallingPetals.length - 1; i >= 0; i--) {
        const fp = fallingPetals[i];
        fp.y += fp.vy * dt;
        fp.x += (fp.vx + Math.sin(elapsed * fp.swayFreq + fp.swayPhase) * 18 + pointerWind * 40) * dt;
        fp.rot += fp.rotSpeed * dt;

        if (fp.y > height * 0.92) {
          fp.alpha -= dt * 1.5;
        }
        if (fp.alpha <= 0 || fp.y > height + 20) {
          fallingPetals.splice(i, 1);
          continue;
        }

        offCtx.save();
        offCtx.translate(fp.x, fp.y);
        offCtx.rotate(fp.rot);
        offCtx.globalAlpha = clamp01(fp.alpha);
        offCtx.fillStyle = petalFill;
        offCtx.beginPath();
        offCtx.moveTo(0, -fp.size);
        offCtx.quadraticCurveTo(fp.size * 0.75, 0, 0, fp.size);
        offCtx.quadraticCurveTo(-fp.size * 0.75, 0, 0, -fp.size);
        offCtx.fill();
        offCtx.restore();
      }

      const particleAlpha = smoothstep(3.2, 5.2, elapsed);
      const sp = currentPalette.sparkle;
      if (particleAlpha > 0.01) {
        pollenParticles.forEach((pt) => {
          const cycle = (elapsed * pt.speed * motionFactor + pt.seed) % 1;
          const fade = Math.sin(cycle * Math.PI) * particleAlpha;
          const px = cx + pt.rx * bouquetSize * 0.85 + Math.sin(elapsed * 1.4 + pt.seed) * 14 * motionFactor + sway * 0.7 + parallaxX * 0.8;
          const py = cy + pt.ry * bouquetSize * 0.55 - cycle * bouquetSize * 0.28 + parallaxY * 0.8;

          offCtx.fillStyle = pt.isAccent
            ? `rgba(${Math.round(sp[0])}, ${Math.round(sp[1])}, ${Math.round(sp[2])}, ${fade})`
            : `rgba(255, 245, 195, ${fade})`;
          offCtx.beginPath();
          offCtx.arc(px, py, Math.max(cellSize * 0.55, pt.size), 0, Math.PI * 2);
          offCtx.fill();
        });
      }

      if (isPointerDown && performance.now() - pointerDownTime > 220) {
        const fireflyCount = 16;
        for (let i = 0; i < fireflyCount; i++) {
          const a = elapsed * 2.4 + (i / fireflyCount) * Math.PI * 2;
          const orbitRx = bouquetSize * (0.34 + (i % 3) * 0.08);
          const orbitRy = bouquetSize * (0.26 + (i % 2) * 0.07);
          const fx = cx + Math.cos(a) * orbitRx + sway * 0.5 + parallaxX * 0.9;
          const fy = cy - bouquetSize * 0.14 + Math.sin(a * 1.3) * orbitRy + parallaxY * 0.9;

          offCtx.fillStyle = i % 2 === 0
            ? `rgba(${Math.round(sp[0])}, ${Math.round(sp[1])}, ${Math.round(sp[2])}, 0.95)`
            : 'rgba(255, 242, 175, 0.95)';
          offCtx.beginPath();
          offCtx.arc(fx, fy, Math.max(cellSize * 0.8, 3.6), 0, Math.PI * 2);
          offCtx.fill();
        }
      }

      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const p = burstParticles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 35 * dt;
        p.vx *= 0.96;
        p.life -= p.decay * dt;

        if (p.life <= 0) {
          burstParticles.splice(i, 1);
          continue;
        }

        offCtx.fillStyle = `rgba(${p.color[0]}, ${p.color[1]}, ${p.color[2]}, ${p.life})`;
        offCtx.beginPath();
        offCtx.arc(p.x, p.y, Math.max(cellSize * 0.5, p.size * p.life), 0, Math.PI * 2);
        offCtx.fill();
      }
    }

    // =========================================================================
    // 5. KẾT XUẤT LƯỚI KÝ TỰ ASCII SẮC NÉT
    // =========================================================================
    function renderAscii(now) {
      const elapsed = (now - startTime) / 1000;
      const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
      lastFrameTime = now;

      if (elapsed > 5.0 && !wishShown) {
        revealWish();
      }

      updatePalette(dt);

      if (!isPointerDown) {
        targetPointerWind *= 0.92;
      }
      pointerWind = lerp(pointerWind, targetPointerWind, 0.12);
      parallaxX = lerp(parallaxX, targetParallaxX, 0.08);
      parallaxY = lerp(parallaxY, targetParallaxY, 0.08);

      renderScene(elapsed, dt);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      const imgData = offCtx.getImageData(0, 0, cols, rows).data;
      const halfCell = cellSize * 0.5;

      ctx.font = `bold ${cellSize + 1}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      let lastColorKey = -1;

      for (let rIdx = 0; rIdx < rows; rIdx++) {
        const drawY = rIdx * cellSize + halfCell;
        const rowOffset = rIdx * cols;

        for (let cIdx = 0; cIdx < cols; cIdx++) {
          const idx = (rowOffset + cIdx) << 2;
          const r = imgData[idx];
          const g = imgData[idx + 1];
          const b = imgData[idx + 2];

          if ((r | g | b) < 16) continue;

          const lum = (r * 77 + g * 150 + b * 29) >> 8;
          const ch = CHAR_LUT[lum];

          if (ch !== ' ') {
            const colorKey = (r << 16) | (g << 8) | b;
            if (colorKey !== lastColorKey) {
              ctx.fillStyle = `rgb(${r},${g},${b})`;
              lastColorKey = colorKey;
            }
            ctx.fillText(ch, cIdx * cellSize + halfCell, drawY);
          }
        }
      }

      requestAnimationFrame(renderAscii);
    }

    requestAnimationFrame(renderAscii);
  </script>
